
name: Build TWRP Malachite Android 16

on:
  workflow_dispatch:
    inputs:
      allow_missing:
        description: "ALLOW_MISSING_DEPENDENCIES (true/false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    name: Compile TWRP
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # FREE DISK SPACE
      # ==========================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # ==========================================
      # SWAP
      # ==========================================

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3

          sudo apt-get install -y \
            -o Acquire::Retries=3 \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib \
            g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync \
            bc ccache lz4 libssl-dev \
            libncurses-dev imagemagick \
            libelf-dev liblz4-tool \
            libxml2-utils libzstd-dev

      # ==========================================
      # REPO TOOL
      # ==========================================

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl --retry 5 --retry-delay 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ==========================================
      # GIT CONFIG
      # ==========================================

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      # ==========================================
      # INITIALIZE TWRP
      # ==========================================

      - name: Initialize TWRP
        run: |
          mkdir -p twrp
          cd twrp

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      # ==========================================
      # MALACHITE MANIFEST
      # ==========================================

      - name: Add Malachite manifest
        working-directory: twrp
        run: |
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote
              name="malachite"
              fetch="https://github.com/" />

            <project
              path="device/xiaomi/malachite"
              name="mytiantian001/android_device_xiaomi_malachite_twrp"
              remote="malachite"
              revision="A16" />
          </manifest>
          EOF

      # ==========================================
      # SYNC SOURCES
      # ==========================================

      - name: Sync sources
        working-directory: twrp
        run: |
          repo sync -c --no-tags --optimized-fetch -j2

      - name: Check resources after sync
        run: |
          echo "=== DISK ==="
          df -h

          echo "=== MEMORY ==="
          free -h

          echo "=== SOURCE SIZE ==="
          du -sh twrp

          AVAILABLE=$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')

          echo "Available disk: ${AVAILABLE}G"

          if [ "$AVAILABLE" -lt 10 ]; then
            echo "WARNING: Less than 10 GB available."
          fi

      # ==========================================
      # APPLY MALACHITE PATCH
      # ==========================================

      - name: Apply Malachite patch
        working-directory: twrp
        run: |
          set -e

          PATCH="device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"

          if [ ! -f "$PATCH" ]; then
            echo "ERROR: Malachite patch not found!"
            exit 1
          fi

          if git -C bootable/recovery apply --check "../../$PATCH"; then
            git -C bootable/recovery apply "../../$PATCH"
            echo "Malachite patch applied successfully."
          else
            echo "ERROR: Patch cannot be applied."
            exit 1
          fi

      # ==========================================
      # FIX AIDL NDK DEPENDENCIES
      # ==========================================

      - name: Fix TWRP AIDL dependencies
        working-directory: twrp
        run: |
          set -e

          RECOVERY_MK="bootable/recovery/Android.mk"

          if [ ! -f "$RECOVERY_MK" ]; then
            echo "ERROR: Recovery Android.mk not found!"
            exit 1
          fi

          echo "=== BEFORE FIX ==="

          grep -nE \
            'android.security.authorization|android.security.maintenance|android.system.keystore2' \
            "$RECOVERY_MK" || true

          # Modern AIDL NDK backend compatibility.
          # Fix the recovery dependencies specifically.

          sed -i \
            's/-ndk_platform/-ndk/g' \
            "$RECOVERY_MK"

          echo "=== AFTER FIX ==="

          grep -nE \
            'android.security.authorization|android.security.maintenance|android.system.keystore2' \
            "$RECOVERY_MK" || true

          # Verify the failing module was corrected.

          if grep -qF \
            'android.security.authorization-ndk_platform' \
            "$RECOVERY_MK"; then

            echo "ERROR: Old authorization dependency remains!"
            exit 1
          fi

          if ! grep -qF \
            'android.security.authorization-ndk' \
            "$RECOVERY_MK"; then

            echo "ERROR: New authorization dependency not found!"
            exit 1
          fi

          echo "AIDL dependency correction successful."

      # ==========================================
      # DIAGNOSE OTHER STALE REFERENCES
      # ==========================================

      - name: Find remaining stale references
        working-directory: twrp
        run: |
          echo "=== REMAINING NDK_PLATFORM REFERENCES ==="

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.repo \
            --exclude-dir=out \
            --include=Android.mk \
            --include=Android.bp \
            --include='*.mk' \
            --include='*.bp' \
            'ndk_platform' \
            bootable device vendor external system hardware frameworks \
            2>/dev/null | head -n 100 || true

          echo "=== AUTHORIZATION REFERENCES ==="

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.repo \
            --exclude-dir=out \
            'android.security.authorization-ndk_platform' \
            bootable device vendor external system hardware frameworks \
            2>/dev/null || true

      # ==========================================
      # BUILD TWRP
      # ==========================================

      - name: Build TWRP vendor_boot
        working-directory: twrp
        env:
          ALLOW_MISSING_INPUT: ${{ inputs.allow_missing }}
        run: |
          set -euo pipefail

          if [ "$ALLOW_MISSING_INPUT" = "true" ]; then
            export ALLOW_MISSING_DEPENDENCIES=true
          else
            unset ALLOW_MISSING_DEPENDENCIES || true
          fi

          export NINJA_ARGS="-j2"

          echo "=== INITIALIZING BUILD ENVIRONMENT ==="

          source build/envsetup.sh

          echo "=== LUNCH ==="

          lunch twrp_malachite-ap2a-eng

          echo "=== BUILD CONFIGURATION ==="

          echo "Product: $TARGET_PRODUCT"
          echo "Variant: $TARGET_BUILD_VARIANT"
          echo "Jobs: 2"

          echo "=== MEMORY ==="
          free -h

          echo "=== DISK ==="
          df -h

          echo "=== STARTING VENDOR BOOT BUILD ==="

          mkdir -p "$GITHUB_WORKSPACE/build-logs"

          set +e

          mka vendorbootimage -j2 2>&1 | \
            tee "$GITHUB_WORKSPACE/build-logs/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "ERROR: TWRP compilation failed."
            echo "Build exit code: $BUILD_STATUS"
            exit "$BUILD_STATUS"
          fi

          echo "TWRP compilation completed."

      # ==========================================
      # VERIFY IMAGE
      # ==========================================

      - name: Verify vendor_boot image
        working-directory: twrp
        run: |
          set -e

          IMAGE="out/target/product/malachite/vendor_boot.img"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: vendor_boot.img not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$IMAGE")
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo "=== IMAGE INFORMATION ==="

          ls -lh "$IMAGE"

          echo "Size: $SIZE bytes"
          echo "Size: $SIZE_MB MiB"

          echo "=== SHA256 ==="

          sha256sum "$IMAGE"

          echo "=== IMAGE HEADER ==="

          file "$IMAGE"

          # Device vendor_boot partition size:
          # 67108864 bytes (64 MiB)

          if [ "$SIZE" -gt 67108864 ]; then
            echo "WARNING: Image exceeds 64 MiB."
            echo "Do not flash this image!"
            exit 1
          fi

          echo "Image is within the configured partition size."

      # ==========================================
      # UPLOAD TWRP IMAGE
      # ==========================================

      - name: Upload TWRP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Malachite-Android16
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # UPLOAD BUILD LOGS
      # ==========================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Malachite-Build-Logs
          path: |
            build-logs/
            twrp/out/soong.log
            twrp/out/error.log
          if-no-files-found: warn
          retention-days: 7

      # ==========================================
      # FAILURE DIAGNOSTICS
      # ==========================================

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== MEMORY ==="
          free -h

          echo "=== DISK ==="
          df -h

          echo "=== OOM KILLS ==="
          sudo dmesg 2>/dev/null | \
            grep -iE \
            "out of memory|killed process|oom" | \
            tail -n 30 || true

          echo "=== BUILD ERROR SUMMARY ==="

          if [ -f build-logs/build.log ]; then
            grep -inE \
              "FAILED:|error:|fatal:|ninja failed|No rule to make target" \
              build-logs/build.log | \
              tail -n 60 || true
          fi

          echo "=== SOURCE DISK USAGE ==="
          du -sh twrp 2>/dev/null || true

name: Build TWRP Malachite Android 16

on:
  workflow_dispatch:
    inputs:
      allow_missing:
        description: "ALLOW_MISSING_DEPENDENCIES (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  build:
    name: Compile TWRP
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3

          sudo apt-get install -y \
            -o Acquire::Retries=3 \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib \
            g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync \
            bc ccache lz4 libssl-dev \
            libncurses-dev imagemagick

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl --retry 5 --retry-delay 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP
        run: |
          mkdir -p twrp
          cd twrp

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Add Malachite manifest
        working-directory: twrp
        run: |
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote
              name="malachite"
              fetch="https://github.com/" />

            <project
              path="device/xiaomi/malachite"
              name="mytiantian001/android_device_xiaomi_malachite_twrp"
              remote="malachite"
              revision="A16" />
          </manifest>
          EOF

      - name: Sync sources
        working-directory: twrp
        run: |
          repo sync -c --no-tags --optimized-fetch -j2

      - name: Check disk space
        run: |
          df -h
          free -h

      - name: Apply Malachite patch
        working-directory: twrp
        run: |
          PATCH="device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"

          if git -C bootable/recovery apply --check "../../$PATCH"; then
            git -C bootable/recovery apply "../../$PATCH"
            echo "Patch applied successfully."
          else
            echo "Patch cannot be applied. Check the base revision."
            exit 1
          fi

      - name: Fix stale ndk_platform libraries in libtar
        working-directory: twrp
        run: |
          set -e

          FILE="bootable/recovery/libtar/Android.mk"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE was not found."
            exit 1
          fi

          echo "=== before ==="
          grep -n "ndk_platform" "$FILE" || true

          if ! grep -Fq "ndk_platform" "$FILE"; then
            echo "ERROR: no ndk_platform reference found in $FILE."
            cat "$FILE"
            exit 1
          fi

          # apc / authorization / maintenance: drop the removed _platform suffix
          # keystore2: also drop it here, the version number is fixed below
          sed -i 's/-ndk_platform/-ndk/g' "$FILE"

          # keystore2 is a versioned AIDL interface: use the newest version in the tree
          KS_DIR=$(find system/security -type d -path '*aidl_api/android.system.keystore2' 2>/dev/null | head -n 1 || true)
          echo "keystore2 aidl_api dir: ${KS_DIR:-not found}"
          if [ -n "$KS_DIR" ]; then
            ls "$KS_DIR"
            KS_VER=$(ls "$KS_DIR" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            echo "newest frozen keystore2 version: ${KS_VER:-none}"
            if [ -n "$KS_VER" ]; then
              sed -i "s/android.system.keystore2-V[0-9]*-ndk/android.system.keystore2-V${KS_VER}-ndk/" "$FILE"
            fi
          fi

          if grep -Fq "ndk_platform" "$FILE"; then
            echo "ERROR: ndk_platform is still present in $FILE."
            exit 1
          fi

          echo "=== after ==="
          grep -nE "apc-ndk|authorization-ndk|maintenance-ndk|keystore2" "$FILE"

      - name: Find remaining stale references
        working-directory: twrp
        run: |
          grep -rn "ndk_platform" . \
            --include=Android.bp --include=*.mk --include=*.bp \
            --exclude-dir=.repo --exclude-dir=out --exclude-dir=.git \
            | head -n 30 || true
          echo "grep finished"

      - name: Build TWRP vendor_boot
        working-directory: twrp
        run: |
          if [ "${{ github.event.inputs.allow_missing }}" = "true" ]; then
            export ALLOW_MISSING_DEPENDENCIES=true
          fi
          export NINJA_ARGS="-j2"

          source build/envsetup.sh

          lunch twrp_malachite-ap2a-eng

          mka vendorbootimage -j2

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== free ==="
          free -h
          echo "=== df ==="
          df -h
          echo "=== OOM kills ==="
          sudo dmesg | grep -i -E "out of memory|killed process|oom" | tail -n 20 || true

      - name: Verify image
        working-directory: twrp
        run: |
          IMAGE="out/target/product/malachite/vendor_boot.img"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: vendor_boot.img not found!"
            exit 1
          fi

          echo "Build successful!"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Upload TWRP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Malachite-Android16
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error
          retention-days: 14
